keys:
  # PC key - generate with: age-keygen -o ~/.config/sops/age/keys.txt
  - &pc age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # Apollo USB backup key - generate with: age-keygen -o /path/to/apollo/age-keys.txt
  - &apollo age1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
        - *pc
        - *apollo
